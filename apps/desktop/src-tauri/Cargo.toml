[package]
name = "syli-pharmacie"
version = "0.1.0"
description = "Syli Pharmacie, client lourd"
edition = "2021"

[lib]
name = "syli_pharmacie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
