name: Storybook

# Every push to main: the components' tests (axe in jsdom, then in Chromium on
# phone, tablet and computer, light and dark), then the catalog on GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests and axe (jsdom)
        run: pnpm --filter @syli/ui test
      - name: Build Storybook
        run: pnpm --filter @syli/ui build-storybook
      - name: Install Chromium
        run: pnpm --filter @syli/ui exec playwright install --with-deps chromium
      - name: axe and behaviour in Chromium
        run: pnpm --filter @syli/ui exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: packages/ui/test-results
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/ui/storybook-static

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
