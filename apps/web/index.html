<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1a66c9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1722" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Syli Pharmacie</title>
    <script>
      // The theme chosen on this device, before the first paint (no flash).
      try {
        const t = localStorage.getItem("syli.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        // The language too: no first paint in the wrong direction.
        const l = localStorage.getItem("syli.locale");
        const tags = { fr: "fr", en: "en", zh: "zh-Hans", hi: "hi", ar: "ar" };
        if (l in tags) {
          document.documentElement.lang = tags[l];
          document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
